services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file: .env
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_STRIPE_PUBLIC_KEY: ${VITE_STRIPE_PUBLIC_KEY:-pk_test_dummy}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
